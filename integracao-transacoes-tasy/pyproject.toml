[project]
name = "integracao-transacoes-tasy"
version = "0.1.0"
description = "Integração Stone -> Tasy (FastAPI + RabbitMQ + Consumer)"
authors = [
    {name = "Pedro", email = "pedrofurtado@ghr.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "aio-pika (>=9.5.0,<10.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "oracledb (>=2.0.0,<4.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
    "workalendar (>=17.0.0,<18.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)"
]
